# MTR Music Server — запуск без .env
#
# Пути указаны явно, здесь. Никаких переменных, которые нужно где-то объявлять:
# docker compose подставит именно то, что написано ниже, и не сможет молча
# создать пустой анонимный том из-за незаданной переменной.
#
# Меняете библиотеку или каталог состояния — правите эти две строки.
#
# Все прочие параметры (интервал скана, лимит транскодирования, наблюдение за
# каталогом, уровень логов) задаются в веб-интерфейсе: Настройки → Сервер.
# Они хранятся в базе и переживают пересоздание контейнера.
#
# Администратор создаётся на странице первого запуска, пароль нигде в файлах
# не хранится.

services:
  mtr:
    build:
      context: .
      dockerfile: Dockerfile
    image: mtr-app:0.24.2
    container_name: mtr-app
    restart: unless-stopped
    # Ротация логов: без лимита json-file растёт бесконечно и держит диск в работе.
    # Максимум ~30 МБ на контейнер (3 файла по 10 МБ), старые записи удаляются.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4533:4533"
    volumes:
      # Библиотека. Только чтение (:ro): сервер в музыку не пишет.
      - /share/CACHEDEV1_DATA/Multimedia/Music:/music:ro
      # Состояние: обе базы, ключ шифрования, кэш обложек.
      - /share/CACHEDEV1_DATA/Container/mtr-data:/data
      #
      # Другие варианты путей (раскомментируйте нужную пару и закомментируйте верхнюю):
      #
      #   Docker Desktop на Windows:
      #   - D:/music_temp:/music:ro
      #   - D:/data:/data
      #
      #   Linux/NAS:
      #   - /mnt/music:/music:ro
      #   - /mnt/mtr-data:/data
      #
      #   Synology (стандартный том):
      #   - /volume1/music:/music:ro
      #   - /volume1/docker/mtr-data:/data
      #
      # Важно: путь слева — на хосте (до двоеточия), справа — внутри контейнера.
      # Менять /music и /data внутри контейнера не нужно.
    # Ключ шифрования создаётся автоматически в /data/secret.key и переживает
    # пересоздание контейнера. Задавать его вручную не нужно и не рекомендуется:
    # смена ключа делает сохранённые пароли нечитаемыми.
